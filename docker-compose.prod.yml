services:
  app:
    build: .
    image: lunia:latest
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    expose:
      - "3000"

  # Reminder outbox worker (Booking stage): polls processDueMessages() every
  # ~30s to "send" (currently via a logging stub — Stage 6 wires a real
  # WhatsApp/SMS provider) due ScheduledMessage rows. No BullMQ/queue
  # library is used (see worker/index.ts) — it's a plain poll loop, so this
  # service needs no separate broker beyond the shared Postgres.
  #
  # Built from the `migrator` target rather than the production `run` image:
  # `run`'s standalone Next.js output has no `tsx` (or a `worker/` dir) in
  # its slimmed node_modules, while `migrator` already reuses the `build`
  # stage's full node_modules (tsx included) for exactly this kind of
  # one-off/long-running Node script — see that target's comment in the
  # Dockerfile. `pnpm run worker` (via the image's `corepack pnpm`
  # entrypoint) runs the same `worker/index.ts` as `pnpm worker` locally.
  worker:
    build:
      context: .
      target: migrator
    image: lunia:migrate
    command: ["run", "worker"]
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  # One-shot migration/seed runner, built from the `migrator` target (reuses
  # the `build` stage's full `node_modules` — prisma + tsx included). This is
  # the one documented, stable place to run `prisma migrate deploy` /
  # `db:seed` (see docs/RUNBOOK.md and task-11-report.md "Fix round 1") —
  # never run those against the `app` service, even though its image
  # currently happens to carry the same tooling too (see Dockerfile's `run`
  # stage comment). It is not part of `docker compose up` (no `restart:`,
  # not depended on by anything) — invoke it explicitly, e.g.:
  #   docker compose -f docker-compose.prod.yml run --rm migrate prisma migrate deploy
  #   docker compose -f docker-compose.prod.yml run --rm migrate tsx prisma/seed.ts
  migrate:
    build:
      context: .
      target: migrator
    image: lunia:migrate
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  postgres:
    image: postgres:16
    env_file: .env.prod
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lunia}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7
    volumes:
      - redis:/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/lunia.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: always

volumes:
  pg: {}
  redis: {}
