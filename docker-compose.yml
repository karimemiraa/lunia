services:
  # Dev only runs the databases here — the Next.js app and the reminder
  # outbox worker both run on the host via pnpm (not containerized) so they
  # pick up hot-reload/tsx directly: `pnpm dev` and, in a second terminal,
  # `pnpm worker` (polls processDueMessages() every ~30s; see
  # worker/index.ts). See docker-compose.prod.yml for the containerized
  # `worker` service used in production.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lunia
      POSTGRES_PASSWORD: lunia_local
      POSTGRES_DB: lunia
    ports: ["5432:5432"]
    volumes: ["lunia_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunia"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: ["lunia_redis:/data"]
volumes:
  lunia_pg:
  lunia_redis:
