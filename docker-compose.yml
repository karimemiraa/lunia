services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lunia
      POSTGRES_PASSWORD: lunia_local
      POSTGRES_DB: lunia
    ports: ["5432:5432"]
    volumes: ["lunia_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunia"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: ["lunia_redis:/data"]
volumes:
  lunia_pg:
  lunia_redis:
