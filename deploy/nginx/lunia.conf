# Lunia reverse proxy — LIVE config for the Oracle deployment.
# HTTP redirects to HTTPS (except the ACME challenge path); HTTPS terminates
# TLS with the Let's Encrypt cert and proxies to the Next.js app. Cert renewal
# is handled by deploy/scripts/renew-cert.sh via /etc/cron.d/lunia-certbot.
server {
    listen 80;
    listen [::]:80;
    server_name lunia.zealmarketing.net;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lunia.zealmarketing.net;

    ssl_certificate     /etc/letsencrypt/live/lunia.zealmarketing.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunia.zealmarketing.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Media uploads (uploadMedia server action) accept up to 25MB; allow headroom.
    client_max_body_size 30m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
