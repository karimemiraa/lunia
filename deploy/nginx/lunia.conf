# Lunia reverse proxy — HTTP by default; the HTTPS server block below is
# commented out until certificates exist for the domain (see docs/RUNBOOK.md
# "First boot" for the certbot issue flow). Uncomment it, plus the redirect
# line in the HTTP block, once `deploy/certbot/conf/live/<domain>/` exists.

server {
    listen 80;
    listen [::]:80;
    server_name _; # replace with the real domain once known

    # Required so certbot's HTTP-01 challenge can be solved through this
    # proxy without hitting the app.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment once a certificate has been issued for the domain, and
    # replace `server_name _;` above with the real domain name:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

