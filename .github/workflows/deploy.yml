name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lunia

jobs:
  # Quality gate: nothing reaches production unless typecheck, lint and the
  # full unit/integration suite pass against a real, freshly migrated and
  # seeded Postgres 16 (same major as production) + Redis.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lunia
          POSTGRES_PASSWORD: lunia_ci
          POSTGRES_DB: lunia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lunia" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://lunia:lunia_ci@localhost:5432/lunia_ci?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-used-in-production-0123456789
      APP_URL: http://localhost:3000
      NODE_ENV: test
      SEED_OWNER_EMAIL: owner@lunia.local
      SEED_OWNER_PASSWORD: ChangeMe123!
      COMMS_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma client, migrations and seed
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Unit & integration tests
        run: pnpm test

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          command_timeout: 30m
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push migrate/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}:migrate
            ${{ env.IMAGE }}:migrate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Copy compose + nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/lunia.conf,deploy/scripts/backup.sh,deploy/scripts/fetch-offsite-backup.sh,deploy/scripts/check-gift-stubs.sh"
          target: /home/ubuntu/lunia
      - name: Deploy (pull images, migrate, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN,GH_ACTOR,IMAGE,SHA,BACKUP_S3_ENDPOINT,BACKUP_S3_BUCKET,BACKUP_S3_REGION,BACKUP_S3_ACCESS_KEY_ID,BACKUP_S3_SECRET_ACCESS_KEY,BACKUP_ENCRYPTION_KEY
          script: |
            set -e
            cd /home/ubuntu/lunia
            chmod +x deploy/scripts/*.sh

            # Off-site backup settings (root-only) + nightly cron at ~02:15 Riyadh.
            # Values come from GitHub secrets; nothing is written when unset, and
            # backup.sh then keeps local copies only and flags it in admin.
            sudo install -d -m 700 /etc/lunia
            if [ -n "$BACKUP_S3_BUCKET" ]; then
              sudo install -m 600 /dev/null /etc/lunia/backup.env
              {
                printf 'BACKUP_S3_ENDPOINT=%q\n' "$BACKUP_S3_ENDPOINT"
                printf 'BACKUP_S3_BUCKET=%q\n' "$BACKUP_S3_BUCKET"
                printf 'BACKUP_S3_REGION=%q\n' "${BACKUP_S3_REGION:-auto}"
                printf 'BACKUP_S3_ACCESS_KEY_ID=%q\n' "$BACKUP_S3_ACCESS_KEY_ID"
                printf 'BACKUP_S3_SECRET_ACCESS_KEY=%q\n' "$BACKUP_S3_SECRET_ACCESS_KEY"
                printf 'BACKUP_ENCRYPTION_KEY=%q\n' "$BACKUP_ENCRYPTION_KEY"
              } | sudo tee /etc/lunia/backup.env > /dev/null
            else
              echo "::warning::Off-site backup secrets are not set; backups stay on the server only."
            fi
            if [ "$(date +%z)" = "+0300" ]; then BACKUP_HOUR=2; else BACKUP_HOUR=23; fi
            printf 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n15 %s * * * root cd /home/ubuntu/lunia && bash deploy/scripts/backup.sh >> /var/log/lunia-backup.log 2>&1\n' "$BACKUP_HOUR" \
              | sudo tee /etc/cron.d/lunia-backup > /dev/null
            sudo chmod 644 /etc/cron.d/lunia-backup
            printf '/var/log/lunia-backup.log {\n  weekly\n  rotate 8\n  compress\n  missingok\n  notifempty\n}\n' | sudo tee /etc/logrotate.d/lunia-backup > /dev/null

            echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            export LUNIA_IMAGE="$IMAGE" LUNIA_TAG="$SHA" LUNIA_MIGRATE_TAG="migrate-$SHA"
            sudo -E docker compose -f docker-compose.prod.yml pull app worker migrate

            # Safety net before migrations run. Non-fatal so an urgent fix can
            # still ship, but loud in the Actions log.
            sudo bash deploy/scripts/backup.sh || echo "::warning::Pre-deploy backup FAILED, see the log above."
            echo "== Gift cards issued by the old stub charge (read-only) =="
            sudo bash deploy/scripts/check-gift-stubs.sh || echo "::warning::Gift card check failed (non-fatal)."

            sudo -E docker compose -f docker-compose.prod.yml run --rm migrate prisma migrate deploy
            sudo -E docker compose -f docker-compose.prod.yml up -d app worker
            sudo docker image prune -f
            sudo docker logout ghcr.io || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
