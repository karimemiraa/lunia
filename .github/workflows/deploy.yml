name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lunia

jobs:
  # Quality gate: nothing reaches production unless typecheck, lint and the
  # full unit/integration suite pass against a real, freshly migrated and
  # seeded Postgres 16 (same major as production) + Redis.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lunia
          POSTGRES_PASSWORD: lunia_ci
          POSTGRES_DB: lunia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lunia" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://lunia:lunia_ci@localhost:5432/lunia_ci?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-used-in-production-0123456789
      APP_URL: http://localhost:3000
      NODE_ENV: test
      SEED_OWNER_EMAIL: owner@lunia.local
      SEED_OWNER_PASSWORD: ChangeMe123!
      COMMS_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma client, migrations and seed
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Unit & integration tests
        run: pnpm test

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          command_timeout: 30m
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push migrate/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}:migrate
            ${{ env.IMAGE }}:migrate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Copy compose + nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/lunia.conf"
          target: /home/ubuntu/lunia
      - name: Deploy (pull images, migrate, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN,GH_ACTOR,IMAGE,SHA
          script: |
            set -e
            cd /home/ubuntu/lunia
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            export LUNIA_IMAGE="$IMAGE" LUNIA_TAG="$SHA" LUNIA_MIGRATE_TAG="migrate-$SHA"
            sudo -E docker compose -f docker-compose.prod.yml pull app worker migrate
            sudo -E docker compose -f docker-compose.prod.yml run --rm migrate prisma migrate deploy
            sudo -E docker compose -f docker-compose.prod.yml up -d app worker
            sudo docker image prune -f
            sudo docker logout ghcr.io || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
