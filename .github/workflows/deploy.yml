name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lunia

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: run
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push migrate/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}:migrate
            ${{ env.IMAGE }}:migrate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Copy compose + nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/lunia.conf"
          target: /home/ubuntu/lunia
      - name: Deploy (pull images, migrate, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN,GH_ACTOR,IMAGE,SHA
          script: |
            set -e
            cd /home/ubuntu/lunia
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            export LUNIA_IMAGE="$IMAGE" LUNIA_TAG="$SHA" LUNIA_MIGRATE_TAG="migrate-$SHA"
            sudo -E docker compose -f docker-compose.prod.yml pull app worker migrate
            sudo -E docker compose -f docker-compose.prod.yml run --rm migrate prisma migrate deploy
            sudo -E docker compose -f docker-compose.prod.yml up -d app worker
            sudo docker image prune -f
            sudo docker logout ghcr.io || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
